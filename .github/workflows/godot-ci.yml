name: Godot CI

# Smoke test headless do projeto Godot em /game (§6.3 do GDD).
# Importa o projeto e inicializa a cena principal por alguns frames — isso
# pega erros de parse de GDScript e de carregamento de cena a cada push, de graça.
# O export Android assinado (AAB) entra como job separado quando houver keystore/secrets.

on:
  push:
    branches: ["**"]
    paths:
      - "game/**"
      - ".github/workflows/godot-ci.yml"
  pull_request:
    paths:
      - "game/**"
      - ".github/workflows/godot-ci.yml"
  workflow_dispatch:

# Cancela runs anteriores da mesma branch quando um novo push chega — evita
# acumular execuções travadas.
concurrency:
  group: godot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Import + boot headless
    runs-on: ubuntu-latest
    timeout-minutes: 15   # nenhum hang de CI dura horas
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Importar projeto (gera .godot, valida scripts)
        working-directory: game
        run: godot --headless --import

      - name: Smoke test — menu principal
        working-directory: game
        run: godot --headless --quit-after 60 res://scenes/ui/main_menu.tscn

      - name: Smoke test — prólogo
        working-directory: game
        run: godot --headless --quit-after 60 res://scenes/ui/intro.tscn

      - name: Smoke test — vila (Pedra-Alva)
        working-directory: game
        run: godot --headless --quit-after 120 res://scenes/world/vila_pedra_alva.tscn

      - name: Smoke test — dungeon (Cripta)
        working-directory: game
        run: godot --headless --quit-after 180 res://scenes/world/cripta_das_guardias.tscn

      - name: Smoke test — dungeon (Cripta Ala 2)
        working-directory: game
        run: godot --headless --quit-after 120 res://scenes/world/cripta_ala2.tscn

      - name: Smoke test — hub (Encruzilhada)
        working-directory: game
        run: godot --headless --quit-after 120 res://scenes/world/encruzilhada.tscn

      - name: Smoke test — átrio (Floresta)
        working-directory: game
        run: godot --headless --quit-after 120 res://scenes/world/floresta_atrio.tscn

      - name: Smoke test — bosque (Floresta)
        working-directory: game
        run: godot --headless --quit-after 120 res://scenes/world/floresta_bosque.tscn

      - name: Smoke test — dungeon (Floresta Sussurrante)
        working-directory: game
        run: godot --headless --quit-after 120 res://scenes/world/floresta_sussurrante.tscn

      - name: Smoke test — átrio (Forja)
        working-directory: game
        run: godot --headless --quit-after 120 res://scenes/world/forja_atrio.tscn

      - name: Smoke test — fornalhas (Forja)
        working-directory: game
        run: godot --headless --quit-after 120 res://scenes/world/forja_fornalhas.tscn

      - name: Smoke test — dungeon (Forja Afundada)
        working-directory: game
        run: godot --headless --quit-after 120 res://scenes/world/forja_afundada.tscn

      - name: Smoke test — átrio (Torre)
        working-directory: game
        run: godot --headless --quit-after 120 res://scenes/world/torre_atrio.tscn

      - name: Smoke test — dungeon (Torre dos Ventos)
        working-directory: game
        run: godot --headless --quit-after 120 res://scenes/world/torre_dos_ventos.tscn

      - name: Smoke test — átrio (Necrópole)
        working-directory: game
        run: godot --headless --quit-after 120 res://scenes/world/necropole_atrio.tscn

      - name: Smoke test — dungeon (Necrópole de Sal)
        working-directory: game
        run: godot --headless --quit-after 120 res://scenes/world/necropole_de_sal.tscn

      - name: Smoke test — arena opcional (Ecos)
        working-directory: game
        run: godot --headless --quit-after 120 res://scenes/world/arena_ecos.tscn

      - name: Smoke test — final (Coração Mudo)
        working-directory: game
        run: godot --headless --quit-after 120 res://scenes/world/coracao_mudo.tscn

      - name: Testes unitários (GUT)
        working-directory: game
        timeout-minutes: 5
        run: godot --headless -s res://addons/gut/gut_cmdln.gd -gdir=res://test/unit -ginclude_subdirs -glog=1 -gexit

  # -----------------------------------------------------------------------------
  # Export Android (AAB) — desabilitado até existirem os secrets do keystore.
  # Requer: templates de export do Godot + variáveis GODOT_ANDROID_KEYSTORE_*, etc.
  # Habilitar trocando `if: false` e configurando export_presets.cfg.
  # -----------------------------------------------------------------------------
  android-export:
    name: Export Android AAB
    if: false
    needs: smoke-test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Export AAB
        working-directory: game
        run: |
          mkdir -p build/android
          godot --headless --export-release "Android" build/android/ecos-de-lirael.aab
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecos-de-lirael-aab
          path: game/build/android/*.aab

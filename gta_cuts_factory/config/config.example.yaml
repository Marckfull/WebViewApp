# ============================================================================
#  GTA CUTS FACTORY — ARQUIVO DE CONFIGURAÇÃO CENTRAL
# ============================================================================
#  COMO USAR:
#   1. Copie este arquivo para "config.yaml" (mesmo pasta)
#   2. Edite o config.yaml (NUNCA edite o .example, ele é o modelo)
#   3. Linhas que começam com "#" são comentários, o programa ignora
#
#  ⚠️ O config.yaml guarda suas chaves de API e NÃO vai para o Git.
# ============================================================================


# ----------------------------------------------------------------------------
# 1) PROGRAMAS EXTERNOS
# ----------------------------------------------------------------------------
# Deixe "ffmpeg" e "ffprobe" se você instalou pelo winget (Passo 2 da instalação).
# Se instalou manualmente, escreva o caminho completo COM BARRA NORMAL "/", ex:
#   ffmpeg_caminho: "C:/ffmpeg/bin/ffmpeg.exe"
ffmpeg_caminho: "ffmpeg"
ffprobe_caminho: "ffprobe"


# ----------------------------------------------------------------------------
# 2) SAÍDA DO VÍDEO
# ----------------------------------------------------------------------------
video:
  largura: 1080            # 9:16 padrão TikTok/Shorts/Reels
  altura: 1920
  fps: 30
  crf: 20                  # qualidade: menor = melhor e mais pesado (18–24 é bom)
  preset: "veryfast"       # velocidade do encode: ultrafast > veryfast > medium > slow
  bitrate_audio: "160k"

  # Como transformar vídeo horizontal em vertical:
  #   "auto"   = tenta achar o rosto/ação com OpenCV e corta em volta (recomendado)
  #   "centro" = corta o meio da tela (rápido e previsível)
  #   "blur"   = vídeo inteiro no centro + fundo desfocado (não corta nada)
  modo_reframe: "auto"

  duracao_minima_corte: 60   # segundos (1 minuto)
  duracao_maxima_corte: 180  # segundos (3 minutos)


# ----------------------------------------------------------------------------
# 3) LEGENDAS  (a parte mais importante do vídeo!)
# ----------------------------------------------------------------------------
legendas:
  # Nome EXATO da fonte instalada no Windows.
  # Opções que já vêm no Windows: "Arial Black", "Impact"
  # Recomendada (instalar pelo Google Fonts): "Montserrat ExtraBold"
  fonte: "Arial Black"
  tamanho_fonte: 96          # tamanho do texto (em vídeo 1080x1920)
  maiusculas: true           # true = TUDO EM MAIÚSCULO (mais impacto)

  palavras_por_linha: 3      # 2 a 4. Menos palavras = texto maior e mais legível
  max_caracteres_linha: 16   # quebra a linha se passar disso

  # Posição vertical: 0.5 = centro exato da tela, 1.0 = base.
  # 0.62 deixa "um pouco abaixo do centro" (pedido do projeto).
  posicao_vertical: 0.62

  # Cores no formato #RRGGBB (como no Paint / seletor de cor)
  cor_texto: "#FFFFFF"           # palavras normais (branco)
  cor_palavra_ativa: "#00E5FF"   # palavra sendo falada AGORA (ciano)
  cor_palavra_chave: "#FFE100"   # palavras de impacto (amarelo)
  cor_contorno: "#000000"        # contorno preto
  cor_sombra: "#000000"

  espessura_contorno: 7      # contorno grosso = legível em qualquer fundo
  sombra: 4
  escala_pop: 118            # quanto a palavra ativa "pula" (100 = sem efeito)

  # Palavras que ganham cor de destaque automaticamente.
  # Pode usar duas palavras juntas, ex: "GTA 6".
  palavras_chave_pt:
    - "GTA 6"
    - "GTA 5"
    - "GTA VI"
    - "ROCKSTAR"
    - "VAZOU"
    - "VAZAMENTO"
    - "CONFIRMADO"
    - "CONFIRMOU"
    - "OFICIAL"
    - "TRAILER"
    - "LANÇAMENTO"
    - "DATA"
    - "ADIADO"
    - "NOVO"
    - "MAPA"
    - "GRÁTIS"
    - "SEGREDO"
    - "AGORA"
  palavras_chave_en:
    - "GTA 6"
    - "GTA 5"
    - "GTA VI"
    - "ROCKSTAR"
    - "LEAK"
    - "LEAKED"
    - "CONFIRMED"
    - "OFFICIAL"
    - "TRAILER"
    - "RELEASE"
    - "DATE"
    - "DELAYED"
    - "NEW"
    - "MAP"
    - "FREE"
    - "SECRET"
    - "NOW"


# ----------------------------------------------------------------------------
# 4) GANCHO DE ABERTURA (os 2 primeiros segundos — prioridade máxima)
# ----------------------------------------------------------------------------
gancho:
  duracao: 2.2               # segundos que a frase fica na tela
  fonte: "Arial Black"
  tamanho_fonte: 110
  cor_texto: "#FFFFFF"
  cor_destaque: "#FFE100"    # a palavra mais forte da frase sai em amarelo
  cor_contorno: "#000000"
  espessura_contorno: 9
  posicao_vertical: 0.30     # 0.30 = parte de cima da tela
  maiusculas: true
  caixa_fundo: true          # tarja escura atrás do texto (ajuda a ler)

  # Frases usadas quando a IA está desligada (o sistema sorteia uma).
  # {assunto} é trocado pelo tema do vídeo.
  modelos_pt:
    - "A ROCKSTAR CONFIRMOU ISSO DO {assunto}?!"
    - "NINGUÉM VIU ISSO NO {assunto}"
    - "ISSO MUDA TUDO NO {assunto}"
    - "VAZOU AGORA: {assunto}"
    - "VOCÊ NÃO SABIA DISSO DO {assunto}"
  modelos_en:
    - "ROCKSTAR JUST CONFIRMED THIS ABOUT {assunto}?!"
    - "NOBODY NOTICED THIS IN {assunto}"
    - "THIS CHANGES EVERYTHING IN {assunto}"
    - "LEAKED: {assunto}"
    - "YOU DIDN'T KNOW THIS ABOUT {assunto}"


# ----------------------------------------------------------------------------
# 5) TRANSCRIÇÃO (Whisper)
# ----------------------------------------------------------------------------
transcricao:
  # Quanto maior, melhor a qualidade e mais lento:
  #   "base" (rápido) < "small" (equilibrado) < "medium" (melhor, pesado)
  modelo: "small"
  dispositivo: "auto"        # "auto", "cpu" ou "cuda" (se tiver placa NVIDIA)
  tipo_computacao: "int8"    # "int8" é rápido na CPU; use "float16" com CUDA
  idioma: null               # null = detecta sozinho; ou "pt" / "en"
  usar_vad: true             # ignora silêncios (melhora muito os tempos)


# ----------------------------------------------------------------------------
# 6) PRODUÇÃO DOS 3 VÍDEOS POR CLIQUE
# ----------------------------------------------------------------------------
producao:
  quantidade: 3
  idiomas: ["pt", "pt", "en"]   # vídeo 1 e 2 em português, vídeo 3 em inglês

  # Quantos dos 3 são MODO A (corte) e quantos são MODO B (narrado com TTS).
  # Modo B tem risco quase zero de Content ID.
  modo_a_cortes: 2
  modo_b_narrados: 1

  jogos_prioridade: ["GTA 6", "GTA 5"]

  # --- Busca de fontes e tendências (Etapa 3) ---
  dias_recentes: 30           # vídeo mais novo que isso ganha pontos na escolha
  candidatos_por_canal: 8     # quantos vídeos recentes olhar em cada canal
  max_cortes_por_video: 3     # nunca tirar mais que isso do MESMO vídeo-fonte
  buscar_tendencias_online: true   # false = usa só a sua lista de assuntos base


# ----------------------------------------------------------------------------
# 6.1) SELEÇÃO DOS MELHORES MOMENTOS (Etapa 4)
# ----------------------------------------------------------------------------
# Aqui você ensina o sistema a reconhecer um "bom momento" dentro do vídeo.
selecao:
  duracao_alvo: 90            # tamanho ideal do corte, em segundos
  ignorar_inicio: 45          # pula a introdução/vinheta do vídeo-fonte
  ignorar_fim: 30             # pula a despedida ("se inscreve, até a próxima")
  distancia_minima_entre_cortes: 30   # segundos entre um corte e outro

  # Nota mínima para um trecho poder virar vídeo. Trecho abaixo disso é
  # DESCARTADO mesmo que falte corte para completar os 3 — é melhor entregar
  # 2 cortes bons do que 3 com um pegando patrocínio ou papo morno.
  # Aumente para ser mais exigente (2.0), diminua para aceitar mais (0.0).
  nota_minima: 1.0

  # Quanto cada coisa vale na nota do trecho (mexa se quiser mudar o "gosto")
  peso_gancho: 3.0            # frase de curiosidade nos primeiros segundos
  peso_palavras_chave: 2.0    # densidade de GTA 6, VAZOU, CONFIRMADO...
  peso_emocao: 1.5            # reação forte (retém mais)
  peso_densidade_fala: 1.0    # trecho com fala constante, sem silêncio longo
  penalidade_autopromocao: 3.0  # "se inscreve", "link na descrição", patrocínio

  # Expressões que indicam um GANCHO (o trecho promete algo)
  palavras_gancho_pt:
    - "olha isso"
    - "presta atenção"
    - "você sabia"
    - "ninguém percebeu"
    - "pela primeira vez"
    - "acabou de"
    - "confirmou"
    - "vazou"
    - "descobri"
    - "olha o que"
    - "não acredito"
    - "isso muda tudo"
    - "o segredo"
    - "a verdade"
  palavras_gancho_en:
    - "look at this"
    - "pay attention"
    - "did you know"
    - "nobody noticed"
    - "for the first time"
    - "just confirmed"
    - "leaked"
    - "i found"
    - "no way"
    - "this changes everything"
    - "the secret"
    - "the truth"

  # Expressões de EMOÇÃO (reação forte segura o espectador)
  palavras_emocao_pt:
    - "caramba"
    - "meu deus"
    - "inacreditável"
    - "absurdo"
    - "impressionante"
    - "chocado"
    - "que loucura"
    - "surreal"
    - "eu não esperava"
  palavras_emocao_en:
    - "oh my god"
    - "insane"
    - "unbelievable"
    - "crazy"
    - "shocked"
    - "i can't believe"
    - "wow"

  # Expressões de AUTOPROMOÇÃO — cortar aqui estraga o vídeo (nota negativa)
  autopromocao_pt:
    - "se inscreve"
    - "se inscreva"
    - "deixa o like"
    - "deixe seu like"
    - "comenta aí"
    - "link na descrição"
    - "ativa o sininho"
    - "patrocínio"
    - "patrocinado"
    - "cupom"
    - "vídeo passado"
    - "próximo vídeo"
    - "membros do canal"
  autopromocao_en:
    - "subscribe"
    - "like the video"
    - "hit the bell"
    - "link in the description"
    - "sponsored by"
    - "use my code"
    - "last video"
    - "next video"
    - "channel members"


# ----------------------------------------------------------------------------
# 6.2) MODO B — VÍDEO NARRADO (Etapa 5)
# ----------------------------------------------------------------------------
# O modo mais seguro contra Content ID: a voz é sua (sintética), o vídeo de
# fundo entra só como apoio de um conteúdo comentado.
narracao:
  duracao_alvo: 75           # tamanho da narração, em segundos
  volume_fundo: 0.12         # 0.0 = fundo mudo | 0.12 = ambiente baixinho
  manter_audio_do_fundo: true

  # Vídeos de fundo padrão (gameplay/trailer). Pode ser arquivo ou pasta.
  # Deixe vazio e passe o fundo pela linha de comando, se preferir.
  pasta_fundos: ""


# ----------------------------------------------------------------------------
# 6.4) B-ROLL — gameplay junto do corte (Etapa 6)
# ----------------------------------------------------------------------------
# Para cortes de "cabeça falando": coloca gameplay rodando junto, para a tela
# não ficar parada. O áudio continua sendo o do corte original.
broll:
  ativo: true
  pasta: ""              # pasta com seus vídeos de gameplay (ex.: "C:/Videos/GTA/broll")

  # "split" = corte em cima, gameplay embaixo
  # "fundo" = gameplay na tela toda, corte como janela em cima
  layout: "split"

  proporcao_principal: 0.55   # (split) quanto da altura fica com o corte
  largura_janela: 0.92        # (fundo) largura da janela do corte
  topo_janela: 0.12           # (fundo) altura em que a janela começa

  # Abaixo deste movimento, a tela é considerada "parada" e o sistema
  # recomenda gameplay junto. Aumente para recomendar mais vezes.
  limite_movimento: 0.08


# ----------------------------------------------------------------------------
# 6.3) METADADOS — título, descrição e hashtags (Etapa 6)
# ----------------------------------------------------------------------------
metadados:
  incluir_credito: true        # link da fonte na descrição (deixe sempre true)
  incluir_aviso_rumor: true    # avisa quando o assunto não é confirmado
  max_hashtags: 6

  # Hashtags amplas (alcance). As específicas do tópico são criadas sozinhas.
  hashtags_base_pt: ["#gta6", "#gta", "#rockstargames", "#shorts"]
  hashtags_base_en: ["#gta6", "#gta", "#rockstargames", "#shorts"]

  # Tags do YouTube (campo separado, não aparece para o público)
  tags_base_pt: ["GTA 6 notícias", "GTA 6 vazamento", "GTA 6 trailer",
                 "GTA 6 data de lançamento", "GTA 5", "GTA Online"]
  tags_base_en: ["GTA 6 news", "GTA 6 leak", "GTA 6 trailer",
                 "GTA 6 release date", "GTA 5", "GTA Online"]

  # Modelos de título quando o fato NÃO é confirmado (viram pergunta).
  # {assunto} é trocado pelo tema do vídeo.
  titulos_perguntas_pt:
    - "{assunto}? Olha o que apareceu"
    - "Será que é verdade isso do {assunto}?"
    - "{assunto}: o que a gente sabe até agora"
    - "Isso muda tudo no {assunto}?"
  titulos_perguntas_en:
    - "{assunto}? Here's what showed up"
    - "Is this real? {assunto}"
    - "{assunto}: what we know so far"
    - "Does this change everything about {assunto}?"

  # Modelos de título quando o fato É confirmado oficialmente
  titulos_afirmativos_pt:
    - "CONFIRMADO: {assunto}"
    - "{assunto} — agora é OFICIAL"
    - "A Rockstar confirmou: {assunto}"
  titulos_afirmativos_en:
    - "CONFIRMED: {assunto}"
    - "{assunto} — now it's OFFICIAL"
    - "Rockstar confirmed: {assunto}"

  resumo_padrao_pt: "Tudo sobre {assunto} em menos de 2 minutos."
  resumo_padrao_en: "Everything about {assunto} in under 2 minutes."

  aviso_rumor_pt: "⚠️ Ainda não há confirmação oficial da Rockstar. Trate como rumor."
  aviso_rumor_en: "⚠️ No official confirmation from Rockstar yet. Treat this as a rumor."

  assinatura_pt: "🔔 Conteúdo diário sobre GTA 6 e GTA 5."
  assinatura_en: "🔔 Daily GTA 6 and GTA 5 content."

  aviso_legal_pt: |
    Este canal não é afiliado nem endossado pela Rockstar Games ou Take-Two.
    Todas as marcas e imagens do jogo pertencem aos seus donos. Uso com fins
    de comentário e análise.
  aviso_legal_en: |
    This channel is not affiliated with or endorsed by Rockstar Games or
    Take-Two. All game trademarks and footage belong to their owners. Used
    for commentary and analysis.


# ----------------------------------------------------------------------------
# 7) SEGURANÇA ANTI-STRIKE  🛡️
# ----------------------------------------------------------------------------
seguranca:
  bloquear_cinematica_sem_narracao: true   # regra da Rockstar
  bloquear_spoilers: true
  nivel_violencia_maximo: "moderado"       # "nenhum" | "moderado" | "qualquer"
  segundos_maximos_cena_grafica: 8         # duração ACUMULADA de cena pesada
  rebaixar_fonte_apos_claim: true          # 1 claim → canal vira "bloqueado"
  exigir_credito_fonte: true

  termos_spoiler:
    - "final do jogo"
    - "ending"
    - "morte de"
    - "quem morre"
    - "final secreto"
    - "plot twist"
    - "spoiler"

  termos_violencia:
    - "tortura"
    - "torture"
    - "massacre"
    - "sangue"
    - "gore"
    - "brutal"


# ----------------------------------------------------------------------------
# 8) CHAVES DE API (deixe em branco até chegar nas etapas finais)
# ----------------------------------------------------------------------------
ia:
  ativa: false               # false = usa frases prontas, custo R$ 0,00
  provedor: "anthropic"      # "anthropic" ou "openai"
  chave_api: ""
  modelo: "claude-sonnet-4-5"
  # Custo aproximado com IA ligada: US$ 0,01 a 0,03 por vídeo.

tts:
  ativo: true
  # "edge"       = GRÁTIS, vozes PT-BR boas, com tempo exato de cada palavra
  # "elevenlabs" = pago (~US$ 0,02–0,05/vídeo), voz mais natural
  # "teste"      = SEM VOZ (áudio mudo) — só para testar o resto do sistema
  #                sem internet. Nunca publique um vídeo feito assim.
  provedor: "edge"
  voz_pt: "pt-BR-AntonioNeural"
  voz_en: "en-US-GuyNeural"
  chave_elevenlabs: ""
  voz_elevenlabs: ""

youtube:
  arquivo_client_secret: "config/client_secret.json"
  privacidade_upload: "unlisted"    # sempre não-listado: você confere antes
  categoria: "20"                   # 20 = Gaming

tiktok:
  pasta_saida: "saida/tiktok"
  usar_api: false
  client_key: ""
  client_secret: ""


# ----------------------------------------------------------------------------
# 9) PASTAS (não precisa mexer)
# ----------------------------------------------------------------------------
pastas:
  downloads: "dados/downloads"
  transcricoes: "dados/transcricoes"
  temporario: "dados/temp"
  saida: "saida"
  banco: "dados/banco.sqlite"
